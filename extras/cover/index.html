<title>Launch Quest Cover</title>

<style>
/* Layout: one 1200x630 game screen. A side-scrolling lunar surface runs on a low-res canvas; title, HUD and prompt sit on top in CSS units that scale with the stage. */
:root {
  --night: #0b1315;
  --deep: #0d3140;
  --leaf: #1d7a4d;
  --thorn: #ff3d6e;
  --cyan: #80EAFF;
  --violet: #9580FF;
  --gold: #ffd166;
  --ink: #ffffff;
  --mute: #b8cdd4;
  --font-pixel: 'Press Start 2P', ui-monospace, Menlo, monospace;
  --font-body: 'Onest', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--night); }
body { margin: 0; color: var(--ink); font-family: var(--font-body); }
.wrap { padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.stage { position: relative; container-type: inline-size; width: 100%; max-width: 1200px; aspect-ratio: 1200 / 630; overflow: hidden; background: var(--night); box-shadow: 0 0 0 .5cqw #000, 0 1.2cqw 3cqw rgba(0,0,0,.6); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.title { position: absolute; left: 3cqw; top: 3cqw; max-width: 46cqw; display: flex; flex-direction: column; gap: 1.2cqw; }
.eyebrow { font-family: var(--font-pixel); font-size: 1.45cqw; letter-spacing: .06em; color: var(--cyan); text-shadow: .25cqw .25cqw 0 #000; }
.title h1 { margin: 0; font-family: var(--font-pixel); font-weight: 400; font-size: 7.4cqw; line-height: 1.12; color: #fff; text-shadow: .5cqw .5cqw 0 #0a6b86, .9cqw .9cqw 0 #000; text-wrap: balance; }
.sub { position: absolute; left: 50%; bottom: 2.4cqw; transform: translateX(-50%); width: 30cqw; margin: 0; text-align: center; font-size: 1.45cqw; line-height: 1.4; color: #e6f6fa; text-shadow: 0 .15cqw .5cqw #000, 0 0 1cqw #000; }
.hud { position: absolute; right: 3cqw; top: 3cqw; width: 25cqw; display: flex; flex-direction: column; gap: 1cqw; padding: 1.4cqw 1.4cqw 1.4cqw 1.8cqw; background: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 1.1cqw, transparent 1.1cqw 2.2cqw), #233134; border-left: .6cqw solid #ffc380; font-family: var(--font-pixel); font-size: 1.05cqw; line-height: 1.4; box-shadow: .5cqw .5cqw 0 rgba(0,0,0,.6); }
.hud-row { display: flex; justify-content: space-between; gap: 1cqw; }
.lvl { color: var(--gold); }
.xp { color: var(--cyan); }
.bar { height: 1.3cqw; background: #141d1f; }
.bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--cyan) 0 .6cqw, #4cc4e0 .6cqw .8cqw); transition: width .5s steps(8); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8cqw; }
.slot { aspect-ratio: 1 / 1.1; background-color: #141d1f; background-repeat: no-repeat; background-position: center; background-size: 88% auto; filter: grayscale(1) brightness(.45); transition: filter .3s; border-bottom: .35cqw solid #546a6f; }

<script>
(function () {
  var W = 480, H = 252, GY = 198, FIGHT_X = 178;
  var LABELS = ['PAYMENTS', 'TAXES', 'FRAUD', 'BUILDS'];
  var ACH = ['FIRST STEPS', 'KEY KEEPER', 'DRAFT DROPPER', 'LAUNCH READY'];
  var CASECOL = ['#b04cf0', '#ffa63d', '#2fd8e0', '#ffd23a'];
  var cv = document.getElementById('c'); cv.width = W; cv.height = H;
  var g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  var reduce = false;
  try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; var x = c.getContext('2d'); x.imageSmoothingEnabled = false; return c; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function disc(x, cx, cy, r, c) { x.fillStyle = c; for (var y = -r; y <= r; y++) { var w = Math.floor(Math.sqrt(r * r - y * y)); x.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); } }
  function rect(c, x, y, w, h) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
  function line(x0, y0, x1, y1, c, th) { var n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; g.fillStyle = c; for (var i = 0; i <= n; i++) { var t = n ? i / n : 0; g.fillRect(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), th, th); } }

  // ---------- pre-rendered layers (tile = one screen, wrap-around)
  var far = mk(W, H), mid = mk(W, H), ground = mk(W, H - GY);
  (function () {
    var x = far.getContext('2d'), r = rng(11), i, off;
    var bands = ['#04050d', '#070815', '#0b0a1f', '#120d2c', '#1a1240', '#241857'];
    for (i = 0; i < bands.length; i++) { x.fillStyle = bands[i]; x.fillRect(0, Math.round(i * GY / bands.length), W, Math.ceil(GY / bands.length) + 1); }
    x.fillStyle = '#241857'; x.fillRect(0, GY - 2, W, H);
    // nebula clouds (wrap-safe)
    var neb = ['#0f0c2e', '#150f3a', '#1b1450', '#0e2338'];
    for (i = 0; i < 40; i++) { var cx = r() * W, cy = 10 + r() * 130, rad = 5 + (r() * 12 | 0); for (off = -W; off <= W; off += W) disc(x, cx + off, cy, rad, neb[i % 4]); }
    for (i = 0; i < 90; i++) { x.fillStyle = ['#ffffff', '#80EAFF', '#b3a3ff', '#ffe6a8'][r() * 4 | 0]; x.fillRect(r() * W | 0, r() * (GY - 30) | 0, 1, 1); }
    for (i = 0; i < 10; i++) { var sx = r() * W | 0, sy = r() * 110 | 0; x.fillStyle = '#ffffff'; x.fillRect(sx, sy, 1, 1); x.fillStyle = 'rgba(255,255,255,.5)'; x.fillRect(sx - 1, sy, 3, 1); x.fillRect(sx, sy - 1, 1, 3); }
    // ringed planet
    var px = 390, py = 128;
    function ring(front) { for (var a = 0; a < 6.283; a += .02) { var sy = Math.sin(a), isFront = sy > 0; if (isFront !== front) continue; x.fillStyle = (Math.floor(a * 10) % 2) ? '#c9b8ff' : '#8f7bd8'; x.fillRect(Math.round(px + Math.cos(a) * 48), Math.round(py - 6 + sy * 11), 2, 2); } }
    ring(false);
    disc(x, px, py, 26, '#4a2590'); disc(x, px - 2, py - 2, 24, '#6c3fc7');
    for (i = -22; i <= 22; i += 5) { var w = Math.floor(Math.sqrt(26 * 26 - i * i)); x.fillStyle = (i / 5 | 0) % 2 ? '#7d52da' : '#5a30a8'; x.fillRect(px - w + 2, py + i, w * 2 - 4, 2); }
    disc(x, px - 9, py - 10, 7, '#9580FF'); disc(x, px - 11, py - 12, 3, '#c9b8ff');
    x.fillStyle = 'rgba(8,6,24,.55)'; for (i = 0; i < 26; i++) { var w2 = Math.floor(Math.sqrt(26 * 26 - (i - 0) * (i - 0))); }
    ring(true);
    // small teal moon
    disc(x, 92, 56, 9, '#2a6f7a'); disc(x, 90, 54, 8, '#3fa3ae'); disc(x, 87, 51, 2, '#5fc7d0'); disc(x, 94, 59, 2, '#2a6f7a');
    // far horizon glow
    for (i = 0; i < 6; i++) { x.fillStyle = 'rgba(149,128,255,' + (0.05 + i * .02) + ')'; x.fillRect(0, GY - 14 + i * 2, W, 2); }
  })();
  (function () {
    var x = mid.getContext('2d'), r = rng(23), i, k, off;
    // lunar ridges
    for (var layer = 0; layer < 2; layer++) {
      var base = GY - (layer ? 12 : 26), col = layer ? '#262250' : '#1b1840', hi = layer ? '#3a3470' : '#2c2860';
      for (off = 0; off < 1; off++) {
        var h0 = 0;
        for (i = 0; i < W; i += 2) {
          var hh = Math.round(10 + Math.sin(i * .035 + layer * 2) * 7 + Math.sin(i * .09 + layer) * 4 + Math.sin(i * (2 * Math.PI / W) * 3) * 3);

          x.fillStyle = hi; x.fillRect(i, base - hh, 2, 1);

      }
    }
    // station + dishes (wrap-safe, placed away from the seam)
    function dish(dx, dy) { x.fillStyle = '#2f2a63'; x.fillRect(dx, dy - 14, 2, 14); x.fillRect(dx - 6, dy - 16, 14, 2); x.fillRect(dx - 5, dy - 14, 12, 1); x.fillStyle = '#80EAFF'; x.fillRect(dx + 1, dy - 18, 2, 2); }
    dish(70, GY - 18); dish(300, GY - 20); dish(430, GY - 16);
    // habitat dome with lit windows
    var hx = 200, hy = GY - 20; disc(x, hx, hy, 16, '#33306d'); x.fillStyle = '#262250'; x.fillRect(hx - 18, hy, 37, 10);
    for (i = -2; i <= 2; i++) { x.fillStyle = i % 2 ? '#ffe6a8' : '#80EAFF'; x.fillRect(hx + i * 6 - 1, hy - 5, 3, 3); }

    // solar panel arrays
